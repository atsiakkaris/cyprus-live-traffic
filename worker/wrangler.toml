# Used by Cloudflare Workers Builds for git-connected auto-deploy on push
# to main (see worker/README.md). wrangler deploy also works locally against
# this config if Node + wrangler are ever set up.

name = "cyprus-live-traffic"
main = "worker.js"
compatibility_date = "2026-08-01"

[triggers]
# "*/5 * * * *": regular tick — live speeds + events, cached geometry.
# "0 */6 * * *": 4x/day — also re-fetches/re-parses geometry (see
# GEOMETRY_CRON in worker.js, must match this second entry exactly).
crons = ["*/5 * * * *", "0 */6 * * *"]

# Without this, a git-connected `wrangler deploy` resets Observability Logs to
# disabled on every deploy (dashboard-only toggle, not wrangler's default) —
# which is exactly what silently killed log visibility after the first
# git-connected deploy despite cron continuing to run fine underneath.
[observability.logs]
enabled = true
invocation_logs = true

[[kv_namespaces]]
binding = "TRAFFIC_KV"
id = "1ccde47ff053431da42a59df1a0c0602"
