name: Poll live traffic feed

on:
  workflow_dispatch: {}
  # Triggered externally via cron-job.org every ~10-15 min, hitting this
  # workflow's dispatch endpoint. GitHub's own `schedule:` trigger isn't used
  # here — it gets silently delayed/dropped under load at short intervals,
  # and disables itself after 60 days without a push to the repo.

permissions:
  contents: write

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Fetch latest live snapshot
        run: python poller/fetch_live.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add preview/latest.json
          git diff --staged --quiet || git commit -m "chore: refresh live snapshot $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
