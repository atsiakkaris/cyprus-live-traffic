<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Cyprus Live Traffic — Preview</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1a1a2e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />
<style>
  /* Theme tokens: light values here are the defaults; the system-preference
     media query and the manual light/dark toggle (data-theme attribute on
     <html>) both just override these same variables, so every consuming
     rule below only has to be written once. */
  :root {
    --panel-bg: rgba(255,255,255,0.95);
    --panel-color: #1a1a2e;
    --sheet-bg: #fff;
    --divider-color: #ddd;
    --sheet-handle-bg: #ddd;
    --sheet-sub-color: #444;
    --sheet-close-color: #999;
    --sheet-unit-color: #888;
    --freshness-color: #888;
    --stale-color: #c0392b;
    --locate-active-bg: #eee;
    --locate-stroke: #1a1a2e;
    --loading-bg: rgba(255,255,255,0.5);
    /* Roughly matches each basemap's own dominant tone (CARTO Voyager's
       cream / dark_all's near-black) so the map area isn't stark white
       while tiles are still loading in — a themed placeholder instead of a
       flash of default browser background. */
    --map-placeholder-bg: #e8e6dd;
    /* Two durations reused everywhere instead of one-off values per rule
       (was a mix of 150/200/220/250ms scattered around) — micro-interactions
       (toggles, chevrons) use fast, anything that moves a larger chunk of UI
       (sheet, backdrop, loading overlay) uses base. */
    --dur-fast: 150ms;
    --dur-base: 220ms;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --panel-bg: rgba(30,30,36,0.95);
      --panel-color: #eee;
      --sheet-bg: rgba(30,30,36,0.95);
      --divider-color: #444;
      --sheet-handle-bg: #555;
      --sheet-sub-color: #ccc;
      --sheet-close-color: #aaa;
      --sheet-unit-color: #aaa;
      --freshness-color: #aaa;
      --stale-color: #ff7675;
      --locate-active-bg: #3a3a42;
      --locate-stroke: #eee;
      --loading-bg: rgba(20,20,24,0.5);
      --map-placeholder-bg: #1a1a1e;
    }
  }
  :root[data-theme="dark"] {
    --panel-bg: rgba(30,30,36,0.95);
    --panel-color: #eee;
    --sheet-bg: rgba(30,30,36,0.95);
    --divider-color: #444;
    --sheet-handle-bg: #555;
    --sheet-sub-color: #ccc;
    --sheet-close-color: #aaa;
    --sheet-unit-color: #aaa;
    --freshness-color: #aaa;
    --stale-color: #ff7675;
    --locate-active-bg: #3a3a42;
    --locate-stroke: #eee;
    --loading-bg: rgba(20,20,24,0.5);
    --map-placeholder-bg: #1a1a1e;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body, #map { height: 100%; margin: 0; overflow: hidden; overscroll-behavior: none; }
  #map { background: var(--map-placeholder-bg); }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }

  /* Holds the legend and the events toggle as two separate stacked panels
     (not merged into one box) — this wrapper owns the shared top-right
     positioning so the toggle always sits directly under the legend
     regardless of whether the legend is collapsed or expanded. */
  .legend-wrap {
    position: absolute; z-index: 1000;
    top: calc(env(safe-area-inset-top, 0px) + 12px);
    right: calc(env(safe-area-inset-right, 0px) + 12px);
    display: flex; flex-direction: column; align-items: flex-end; gap: 8px;
  }

  .legend {
    background: var(--panel-bg); color: var(--panel-color);
    padding: 10px 14px; border-radius: 12px;
    font-size: 13px; line-height: 1.9;
    box-shadow: 0 2px 10px rgba(0,0,0,.18);
    max-width: 250px;
    /* Matches the filter-row below it (4 buttons + gaps, see .filter-row)
       so both rows' left edges line up under the same collapsed chip width
       instead of the chip sitting narrower and inset from the icons. */
    min-width: 200px;
  }
  .legend div { display: flex; align-items: center; }
  /* Scoped to .legend-body, not the whole .legend — it must not also catch
     the header's <span> elements (legend-header-actions, chevron), which
     need their own (flex) layout rather than a forced 10x10 dot. */
  .legend-body span { display: inline-block; width: 10px; height: 10px; margin-right: 8px; border-radius: 50%; }

  .legend-header {
    display: flex; align-items: center; justify-content: space-between;
    font-weight: 600; cursor: pointer; user-select: none;
    /* Content alone (the 26px chevron) only made this row ~26px tall — well
       under the ~44px minimum recommended touch target on mobile. min-height
       pads it out without changing how anything inside actually looks,
       since align-items: center keeps everything vertically centered. */
    min-height: 44px;
  }
  /* Sized well past the text around it — the whole header row already
     toggles collapse on tap, but this is the part meant to read as "tap
     here to open the menu" on a phone. Margins tuned so it sits equidistant
     between the theme toggle and the panel's right edge, not flush against
     either. */
  .legend-header .chevron { font-size: 26px; line-height: 1; margin-left: 8px; margin-right: 2px; transition: transform var(--dur-fast) ease; }
  .legend.collapsed .legend-header .chevron { transform: rotate(-90deg); }
  .legend .legend-body {
    display: block; /* .legend div{display:flex} would otherwise turn this
      wrapper itself into a row flex container, laying its row children out
      side-by-side instead of stacked */
    overflow: hidden; max-height: 400px;
    transition: max-height var(--dur-fast) ease, opacity var(--dur-fast) ease, margin-top var(--dur-fast) ease;
    margin-top: 6px; opacity: 1;
  }
  .legend.collapsed .legend-body { max-height: 0; opacity: 0; margin-top: 0; }

  .leaflet-control-zoom { display: none; } /* pinch-to-zoom only, no mouse-style +/- buttons */

  /* Bottom sheet */
  .sheet {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 2000;
    background: var(--sheet-bg); color: var(--panel-color); border-radius: 20px 20px 0 0;
    box-shadow: 0 -4px 20px rgba(0,0,0,.2);
    padding: 10px 20px calc(env(safe-area-inset-bottom, 0px) + 24px);
    transform: translateY(110%);
    transition: transform var(--dur-base) ease;
  }
  .sheet.open { transform: translateY(0); }
  .sheet-handle {
    width: 36px; height: 4px; background: var(--sheet-handle-bg); border-radius: 2px;
    margin: 0 auto 14px;
  }
  .sheet-close {
    position: absolute; top: 10px; right: 14px;
    width: 30px; height: 30px; border: none; background: none;
    display: flex; align-items: center; justify-content: center;
    color: var(--sheet-close-color); font-size: 20px; line-height: 1;
  }
  .sheet-speed { font-size: 32px; font-weight: 700; }
  .sheet-speed .unit { font-size: 16px; font-weight: 500; color: var(--sheet-unit-color); margin-left: 4px; }
  .sheet-nodata { font-size: 17px; color: var(--sheet-unit-color); padding: 8px 0; }

  /* Purely visual dimming — never intercepts touches, so the map stays
     pannable/zoomable while the sheet is open. */
  .backdrop {
    position: fixed; inset: 0; z-index: 1500;
    background: rgba(0,0,0,0.15);
    opacity: 0; pointer-events: none;
    transition: opacity var(--dur-base) ease;
  }
  .backdrop.open { opacity: 1; }

  /* Groups zoom +/- above the locate button as one bottom-right stack,
     matching the legend-wrap pattern used top-right — a single positioned
     column instead of each button carrying its own absolute offset. */
  .map-controls {
    position: absolute; z-index: 1000;
    right: calc(env(safe-area-inset-right, 0px) + 12px);
    bottom: calc(env(safe-area-inset-bottom, 0px) + 28px);
    display: flex; flex-direction: column; align-items: center; gap: 10px;
  }
  .zoom-btn, .locate-btn, .share-btn {
    width: 46px; height: 46px; border-radius: 50%;
    background: var(--panel-bg); border: none;
    box-shadow: 0 2px 10px rgba(0,0,0,.25);
    display: flex; align-items: center; justify-content: center;
  }
  .zoom-btn:active, .locate-btn:active, .share-btn:active { background: var(--locate-active-bg); }
  .share-btn svg { width: 22px; height: 22px; stroke: var(--locate-stroke); }
  .zoom-btn { font-size: 22px; line-height: 1; color: var(--locate-stroke); }
  .zoom-btn.disabled { opacity: 0.35; pointer-events: none; }
  .locate-btn svg { width: 24px; height: 24px; stroke: var(--locate-stroke); }
  .locate-btn.locating svg { animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  /* Persists until geolocation actually succeeds, instead of only a toast
     that vanishes after a few seconds — so looking at the button later
     still tells you why it isn't auto-centering. */
  .locate-btn.denied { position: relative; }
  .locate-btn.denied svg { opacity: 0.4; }
  .locate-btn.denied::after {
    content: ''; position: absolute; top: 6px; right: 6px;
    width: 9px; height: 9px; border-radius: 50%;
    background: var(--stale-color); border: 2px solid var(--panel-bg);
  }

  /* Its own separate panel, not merged into the legend box — stacked below
     it by .legend-wrap instead. Three independent chips (rather than one
     all-or-nothing toggle) so e.g. road works can stay on while hazard
     noise stays off. */
  .filter-row { display: flex; gap: 8px; }
  .filter-toggle {
    background: var(--panel-bg); border: none; border-radius: 22px;
    width: 44px; height: 44px;
    box-shadow: 0 2px 10px rgba(0,0,0,.18);
    display: flex; align-items: center; justify-content: center;
    opacity: 0.65; transition: opacity var(--dur-fast) ease;
  }
  .filter-toggle.active { opacity: 1; }

  /* Designed state instead of a transient toast — stays visible for as
     long as the condition holds (an active filter with nothing to show),
     not a timed message that disappears whether or not anything changed. */
  .filter-empty-hint {
    align-self: flex-end;
    max-width: 180px; text-align: right;
    background: var(--panel-bg); color: var(--freshness-color);
    padding: 6px 12px; border-radius: 14px;
    font-size: 11px; line-height: 1.4;
    box-shadow: 0 2px 10px rgba(0,0,0,.18);
    max-height: 60px; opacity: 1;
    overflow: hidden;
    transition: max-height var(--dur-fast) ease, opacity var(--dur-fast) ease, margin-top var(--dur-fast) ease;
  }
  .filter-empty-hint:empty { max-height: 0; opacity: 0; margin-top: -8px; padding: 0 12px; }
  .filter-empty-hint:not(:empty) { margin-top: 0; }

  .freshness {
    position: absolute; z-index: 1000;
    top: calc(env(safe-area-inset-top, 0px) + 12px);
    left: calc(env(safe-area-inset-left, 0px) + 12px);
    background: var(--panel-bg); padding: 6px 12px; border-radius: 20px;
    font-size: 12px; color: var(--freshness-color);
    box-shadow: 0 2px 10px rgba(0,0,0,.18);
    /* Without this, the "Data outdated since ..." line has no width limit
       and grows to fit its full text on one line — on narrower phones that
       reaches far enough right to overlap the legend panel. Capped and left
       to wrap instead, same guard the legend box already has.
       Sized against the legend's own min-width (200px, see .legend) plus
       its right margin and a small gap, not just a flat vw fraction — a
       plain 42vw stopped being safe once the legend got a guaranteed
       minimum footprint on the right and the two started overlapping. */
    max-width: calc(100vw - 236px);
  }
  .freshness.stale { color: var(--stale-color); font-weight: 600; }
  /* Discreet second line — only shown when the underlying feed data itself
     is old, distinct from the line above which only proves our own poll
     succeeded (a poll can succeed every few minutes while silently serving
     the same frozen measurement over and over). Smaller/lighter than the
     line above so it doesn't compete for attention when everything's fine —
     which is most of the time, it's hidden entirely. */
  .outdated-note { font-size: 10px; color: var(--stale-color); margin-top: 2px; }

  /* Lives inside the legend header instead of as a fourth separate floating
     chip — it only matters when you're already looking at legend colors. */
  .legend-header-actions { display: flex; align-items: center; gap: 8px; }
  .theme-toggle {
    background: none; border: none; padding: 4px; font-size: 14px;
    opacity: 1; line-height: 1;
  }

  .toast {
    position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 90px);
    transform: translateX(-50%) translateY(10px);
    background: rgba(20,20,20,0.92); color: white;
    padding: 10px 16px; border-radius: 10px; font-size: 14px;
    z-index: 3000; opacity: 0; pointer-events: none;
    transition: opacity var(--dur-fast) ease, transform var(--dur-fast) ease;
    white-space: nowrap;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* Point-report markers (Waze alerts, official road-works/incident situations) */
  .leaflet-div-icon { background: transparent; border: none; }
  .report-marker {
    width: 30px; height: 30px; border-radius: 50%;
    border: 2px solid white; box-shadow: 0 1px 4px rgba(0,0,0,.4);
    display: flex; align-items: center; justify-content: center;
    line-height: 1;
    animation: marker-in 220ms ease-out;
  }
  @keyframes marker-in {
    from { transform: scale(0.3); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
  }

  /* Instant, JS-driven press feedback (touchstart/touchend) instead of
     relying on CSS :active — mobile browsers can delay :active while they
     disambiguate a tap from the start of a scroll, which reads as sluggish
     on a button that's meant to feel immediate. */
  .pressable { transition: transform 80ms ease, opacity 80ms ease; }
  .pressable.pressed { transform: scale(0.9); opacity: 0.7; }

  .legend .divider { height: 1px; background: var(--divider-color); margin: 6px 0; }
  .legend .swatch-line { width: 14px; height: 4px; border-radius: 2px; margin-right: 8px; }
  /* Legend dots for point-report rows mirror the actual on-map marker: a
     colored circle with the same icon inside, not a plain color swatch. */
  .legend .swatch-symbol {
    width: 16px; height: 16px; border-radius: 50%; margin-right: 8px;
    display: inline-flex; align-items: center; justify-content: center;
    line-height: 1;
  }

  .sheet-title { font-size: 18px; font-weight: 700; }
  .sheet-sub { font-size: 15px; color: var(--sheet-sub-color); margin-top: 4px; }
  .sheet-meta { font-size: 13px; color: var(--sheet-unit-color); margin-top: 8px; }
  /* Sits between the big speed number and the travel-time line, and carries
     more weight than .sheet-meta — it's the line that tells you whether the
     number above is good or bad, which is the actual question. */
  .sheet-context { font-size: 14px; font-weight: 600; margin-top: 6px; }
  .sheet-source { font-size: 11px; color: var(--sheet-unit-color); margin-top: 10px; opacity: 0.7; }

  .loading-overlay {
    position: absolute; inset: 0; z-index: 1800;
    display: flex; align-items: center; justify-content: center;
    background: var(--loading-bg);
    opacity: 1; transition: opacity var(--dur-base) ease;
    pointer-events: none;
  }
  .loading-overlay.hidden { opacity: 0; }
  .spinner {
    width: 36px; height: 36px; border-radius: 50%;
    border: 4px solid rgba(0,0,0,0.15); border-top-color: #1a1a2e;
    animation: spin 1s linear infinite;
  }

  /* Recolor markercluster's default blue/yellow/orange badges to match the
     app's white-pill aesthetic instead of looking like an unstyled plugin. */
  .marker-cluster { background: rgba(255,255,255,0.7) !important; }
  .marker-cluster div {
    background: rgba(26,26,46,0.92) !important;
    color: white; font-weight: 600; font-size: 12px;
  }
  .marker-cluster span { color: white; }

</style>
</head>
<body>
<div id="map"></div>
<div class="loading-overlay" id="loadingOverlay"><div class="spinner"></div></div>

<div class="freshness" id="freshness">
  <div id="freshnessText"></div>
  <div class="outdated-note" id="outdatedNote" hidden></div>
</div>

<div class="legend-wrap">
  <div class="legend collapsed" id="legend">
    <div class="legend-header" id="legendHeader">
      <span>Legend</span>
      <span class="legend-header-actions">
        <button class="theme-toggle" id="themeToggle" aria-label="Toggle light/dark theme">🌙</button>
        <span class="chevron">▾</span>
      </span>
    </div>
    <div class="legend-body">
      <div><span id="legendFast" style="background:#2ecc71"></span>Free flow</div>
      <div><span id="legendModerate" style="background:#f1c40f"></span>Light–moderate traffic</div>
      <div><span id="legendSlow" style="background:#e74c3c"></span>Heavy traffic</div>
      <div><span style="background:#95a5a6"></span>No data</div>
      <div class="divider event-legend"></div>
      <div class="event-legend"><span class="swatch-line" style="background:#9d4edd"></span>Crowdsourced jam</div>
      <div class="event-legend"><span class="swatch-symbol" style="background:#c0392b"><svg width="10" height="10" viewBox="0 0 24 24" fill="white"><path d="M15 21a1 1 0 0 1 0-2h1v-2H8v2h1a1 1 0 0 1 0 2H5a1 1 0 0 1 0-2h1v-2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h1V5a1 1 0 1 1 2 0v1h8V5a1 1 0 0 1 2 0v1h1a2 2 0 0 1 2 2v7a2 2 0 0 1-2 2h-1v2h1a1 1 0 0 1 0 2zM12.914 8l-7 7h4.17L17 8zM19 10.914L14.914 15H19zM8.084 8H5v3.084z"/></svg></span>Road closed</div>
      <div class="event-legend"><span class="swatch-symbol" style="background:#f39c12"><svg width="10" height="10" viewBox="0 0 24 24" fill="white"><path fill-rule="evenodd" d="M9.616 3.642c1.058-1.839 3.71-1.839 4.768 0l8.043 13.988c1.054 1.833-.27 4.12-2.384 4.12H3.957c-2.115 0-3.438-2.287-2.384-4.12zM12 8.25a.75.75 0 0 1 .75.75v4a.75.75 0 0 1-1.5 0V9a.75.75 0 0 1 .75-.75m.568 9.25a.75.75 0 0 0-1.115-1.003l-.01.011a.75.75 0 0 0 1.114 1.004z" clip-rule="evenodd"/></svg></span>Hazard</div>
      <div class="event-legend"><span class="swatch-symbol" style="background:#d90429"><svg width="10" height="8" viewBox="0 0 640 512" fill="white"><path d="M176 8c-6.6 0-12.4 4-14.9 10.1l-29.4 74l-76.1-23.2c-6.3-1.9-13.1.2-17.2 5.3S33.8 86.4 37 92.1l39.5 69.1l-65.6 45.2c-5.4 3.7-8 10.3-6.5 16.7s6.7 11.2 13.1 12.2l78.7 12.2l-5.6 79.5c-.5 6.5 3.1 12.7 9 15.5s12.9 1.8 17.8-2.6l35.3-32.5l9.5-35.4l10.4-38.6c8-29.9 30.5-52.1 57.9-60.9l41-59.2C282.8 97 297.9 84.4 315 76.1c-.4-.6-.8-1.2-1.3-1.8c-4.1-5.1-10.9-7.2-17.2-5.3l-76.2 23.1l-29.4-74C188.4 12 182.6 8 176 8m191.7 153.5l135.6 36.3c6.5 1.8 11.3 7.4 11.8 14.2l4.6 56.5l-201.5-54l32.2-46.6c3.8-5.6 10.8-8.1 17.3-6.4m-69.9-30l-47.9 69.3c-21.6 3-40.3 18.6-46.3 41l-10.4 38.6l-16.6 61.8l-8.3 30.9c-4.6 17.1 5.6 34.6 22.6 39.2l15.5 4.1c17.1 4.6 34.6-5.6 39.2-22.6l8.3-30.9l247.3 66.3l-8.3 30.9c-4.6 17.1 5.6 34.6 22.6 39.2l15.5 4.1c17.1 4.6 34.6-5.6 39.2-22.6l8.3-30.9L595 388l10.4-38.6c6-22.4-2.5-45.2-19.6-58.7l-6.8-84c-2.7-33.7-26.4-62-59-70.8L384.2 99.7c-32.7-8.8-67.3 4-86.5 31.8zm-17 131a24 24 0 1 1-12.4 46.4a24 24 0 1 1 12.4-46.4m217.9 83.2a24 24 0 1 1 46.3 12.4a24 24 0 1 1-46.4-12.4z"/></svg></span>Accident</div>
      <div class="event-legend"><span class="swatch-symbol" style="background:#e67e22"><svg width="10" height="10" viewBox="0 0 24 24" fill="white"><path d="M18.5 18.5c.54 0 1 .46 1 1s-.46 1-1 1h-12c-.54 0-1-.46-1-1s.46-1 1-1zm0-1.5h-12C5.13 17 4 18.13 4 19.5S5.13 22 6.5 22h12a2.5 2.5 0 0 0 0-5m2.5-6h-3V7h-5l-3 4v5h12zm-9.46 0l1.96-2.5H16V11zM9.76 3.41L4.76 2L2 11.83c-.34 1.28.41 2.61 1.7 2.97l1.16.32l3.29-2.83l-3.88-1.08l1.88-6.75l2.79.78c.56.29 1.77 1.1 2.53 2.13L12.5 6h.44c-1.26-1.59-3.09-2.54-3.18-2.59"/></svg></span>Road works</div>
    </div>
  </div>
  <div class="filter-row event-legend">
    <button class="filter-toggle" id="filterClosures" data-filter="closures" aria-label="Toggle road closures"></button>
    <button class="filter-toggle" id="filterHazards" data-filter="hazards" aria-label="Toggle hazards and accidents"></button>
    <button class="filter-toggle" id="filterJams" data-filter="jams" aria-label="Toggle crowdsourced jams"></button>
    <button class="filter-toggle" id="filterWorks" data-filter="works" aria-label="Toggle road works"></button>
  </div>
  <div class="filter-empty-hint" id="filterEmptyHint"></div>
</div>

<div class="backdrop" id="backdrop"></div>
<div class="sheet" id="sheet">
  <button class="sheet-close" id="sheetClose" aria-label="Close">&times;</button>
  <div class="sheet-handle"></div>
  <div id="sheetBody"></div>
</div>

<div class="map-controls">
  <button class="share-btn" id="shareBtn" aria-label="Share this view">
    <svg viewBox="0 0 24 24" fill="none" stroke="#1a1a2e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="18" cy="5" r="3"></circle>
      <circle cx="6" cy="12" r="3"></circle>
      <circle cx="18" cy="19" r="3"></circle>
      <path d="M8.6 13.5l6.8 4M15.4 6.5l-6.8 4"></path>
    </svg>
  </button>
  <button class="zoom-btn" id="zoomInBtn" aria-label="Zoom in">+</button>
  <button class="zoom-btn" id="zoomOutBtn" aria-label="Zoom out">&minus;</button>
  <button class="locate-btn" id="locateBtn" aria-label="Find my location">
    <svg viewBox="0 0 24 24" fill="none" stroke="#1a1a2e" stroke-width="2">

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
<script>
// Mirrors FETCH_EVENTS in worker/worker.js. Both are currently on; if the
// Worker ever has to disable the event feeds again (it did once, to fix a
// CPU-limit cron failure), flip this off in the same change so the legend
// rows and filter chips don't advertise data that never arrives.
const EVENTS_ENABLED = true;
if (!EVENTS_ENABLED) {
  document.querySelectorAll('.event-legend').forEach(el => el.style.display = 'none');
}

// Short tap buzz on real actions (filter toggles, marker taps, etc — wired
// at each call site below), not on every touchstart. iOS Safari has never
// implemented the Vibration API at all, so this silently no-ops there.
function haptic(ms = 10) {
  if (navigator.vibrate) navigator.vibrate(ms);
}

// Instant visual press feedback via touchstart/touchend instead of relying
// on CSS :active, which mobile browsers can delay while disambiguating a
// tap from the start of a scroll — applied generically here rather than
// wiring each button's markup by hand.
document.querySelectorAll('.filter-toggle, .zoom-btn, .locate-btn, .share-btn, .theme-toggle, .sheet-close').forEach(el => {
  el.classList.add('pressable');
  el.addEventListener('touchstart', () => el.classList.add('pressed'), { passive: true });
  ['touchend', 'touchcancel'].forEach(evt => el.addEventListener(evt, () => el.classList.remove('pressed')));
});

// Remembers where the user last left the map (center + zoom), so reopening
// the app doesn't always reset to the same country-wide default view — a
// successful geolocation below still wins and recenters on request, this
// only changes what's shown before/instead of that.
const SAVED_VIEW_KEY = 'lastView';
function loadSavedView() {
  try {
    const v = JSON.parse(localStorage.getItem(SAVED_VIEW_KEY));
    // Number.isFinite, not typeof — `typeof NaN === 'number'`, and feeding
    // NaN coordinates to setView breaks the map outright.
    if (v && Number.isFinite(v.lat) && Number.isFinite(v.lng) && Number.isFinite(v.zoom)) return v;
  } catch (e) { /* corrupt/missing — fall through to no saved view */ }
  return null;
}
const savedView = loadSavedView();

// Shared/deep-linked view, e.g.
//   #map=12/34.9182/33.6221&filters=closures,jams
// Kept in the hash rather than the query string for two reasons: it never
// reaches the server or the Worker's logs, and changing it doesn't look like
// a different URL to the service worker's app-shell cache.
//
// zoom/lat/lng in one slash-separated value follows the same convention
// OpenStreetMap uses, so the shape is familiar and hand-editable.
const SHAREABLE_FILTERS = ['closures', 'hazards', 'jams', 'works'];
function parseHashView() {
  if (!location.hash || location.hash.length < 2) return null;
  const params = new URLSearchParams(location.hash.slice(1));
  const result = {};

  const map = params.get('map');
  if (map) {
    const [zoom, lat, lng] = map.split('/').map(Number);
    // Same Number.isFinite guard as loadSavedView, and for the same reason —
    // a hand-mangled link must degrade to "ignore the view" rather than
    // feeding NaN into setView and breaking the map outright. Ranges are
    // checked too since a shared link is untrusted input in a way
    // localStorage isn't.
    if (Number.isFinite(lat) && Number.isFinite(lng) && Number.isFinite(zoom) &&
        lat >= -90 && lat <= 90 && lng >= -180 && lng <= 180 && zoom >= 0 && zoom <= 20) {
      result.lat = lat; result.lng = lng; result.zoom = zoom;
    }
  }

  // Filtered against the known set rather than trusted as-is, so an unknown
  // or misspelled name in a shared link can't index into filterLayers and
  // throw during startup.
  const filters = params.get('filters');
  if (filters) {
    result.filters = filters.split(',').filter(f => SHAREABLE_FILTERS.includes(f));
  }

  return Object.keys(result).length ? result : null;
}
const hashView = parseHashView();

// A shared link wins over the visitor's own last-viewed position: following
// someone's link and landing somewhere else entirely would make the link
// look broken. The saved view stays the fallback for an ordinary open.
const initialView = (hashView && hashView.lat != null) ? hashView : savedView;

// Canvas instead of the SVG default: with 429 roads x 2 lines each plus jam
// segments, canvas rendering keeps pan/zoom noticeably smoother on phones.
const map = L.map('map', { zoomControl: false, tap: true, renderer: L.canvas() }).setView(
  initialView ? [initialView.lat, initialView.lng] : [35.05, 33.15],
  initialView ? initialView.zoom : 9
);
map.on('moveend', () => {
  const c = map.getCenter();
  localStorage.setItem(SAVED_VIEW_KEY, JSON.stringify({ lat: c.lat, lng: c.lng, zoom: map.getZoom() }));
});

// Theme: system preference by default, overridable via the toggle button
// (persisted in localStorage). The override is applied as a data-theme
// attribute on <html>, which both the CSS variables above and the basemap
// tile layer below key off of — so flipping it updates everything at once,
// unlike the old load-once-only approach.
function currentTheme() {
  const stored = localStorage.getItem('theme');
  if (stored === 'light' || stored === 'dark') return stored;
  return (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
}

// CARTO's raster basemap CDN started requiring a key 2026-08 — free tier,
// no approval queue, 5M tile requests/month (this app is nowhere close).
// Necessarily exposed here, not deliberately safe-to-expose: raster tiles
// only work as a direct browser tile-layer request, so the key has to reach
// the browser no matter how it's shipped — unlike e.g. Mapbox's public/
// secret token split, CARTO's docs don't describe this key as engineered
// for client-side use, just don't offer another way to use the product.
// Real fix if this ever matters (quota drained by a scraped key) is proxying
// tile requests through this Worker with the key as a server-side secret,
// same pattern as REFRESH_KEY — parked, not worth the complexity yet at this
// app's traffic. Vector basemaps don't require a key yet; CARTO says they'll
// announce before that changes.
const CARTO_API_KEY = 'cb1_2fyp_1_fe29281e96d0b50c4d0de2f2';

let basemapLayer = null;
function applyBasemap(theme) {
  if (basemapLayer) map.removeLayer(basemapLayer);
  basemapLayer = L.tileLayer(`https://{s}.basemaps.cartocdn.com/${theme === 'dark' ? 'dark_all' : 'rastertiles/voyager'}/{z}/{x}/{y}{r}.png?key=${CARTO_API_KEY}`, {
    attribution: '&copy; OpenStreetMap contributors &copy; <a href="https://carto.com/attributions">CARTO</a>',
    subdomains: 'abcd',
    maxZoom: 20
  }).addTo(map);
  // Only meaningful the first time (see maybeRevealMap) — a later theme
  // toggle firing this again is harmless, tilesReady is already true by then.
  basemapLayer.once('load', () => { tilesReady = true; maybeRevealMap(); });
}

const themeToggleBtn = document.getElementById('themeToggle');
function applyTheme(theme) {
  document.documentElement.setAttribute('data-theme', theme);
  themeToggleBtn.textContent = theme === 'dark' ? '🌙' : '☀️';
  applyBasemap(theme);
}
applyTheme(currentTheme());
themeToggleBtn.addEventListener('click', (e) => {
  e.stopPropagation();
  haptic();
  const next = currentTheme() === 'dark' ? 'light' : 'dark';
  localStorage.setItem('theme', next);
  applyTheme(next);
});

// Starts collapsed so it doesn't eat phone screen space by default — tap
// the header to expand. Doesn't stop event propagation to the map's own
// click-to-close handler since the legend sits outside the map element.
const legend = document.getElementById('legend');
document.getElementById('legendHeader').addEventListener('click', () => {
  legend.classList.toggle('collapsed');
});

// Four independent layer groups instead of one — road closures, hazards
// (including accidents), jams (both crowdsourced jam reports and jam-level
// line segments), and official road works, each with its own toggle chip.
// All start hidden: at low zoom, 100+ large markers visually bury the thin
// road lines underneath them, making the map look broken/empty of roads on
// first open — opt-in per category instead of one all-or-nothing switch.
//
// Closures, hazards, and works are pure point markers, so they cluster at
// low zoom instead of carpeting the map. Jams stays a plain layer group
// since it mixes JAM-type markers with polyline segments — markerClusterGroup
// only clusters L.Marker instances — and jam counts are typically low
// enough that clustering wouldn't help anyway.
// maxClusterRadius lowered (was 50) — markers were merging into clusters
// too readily; a tighter radius keeps individual events visible sooner
// instead of only after zooming all the way in.
const CLUSTER_OPTS = { maxClusterRadius: 35 };
const filterLayers = {
  closures: L.markerClusterGroup(CLUSTER_OPTS),
  hazards: L.markerClusterGroup(CLUSTER_OPTS),
  jams: L.layerGroup(),
  works: L.markerClusterGroup(CLUSTER_OPTS),
};
const filterVisible = { closures: false, hazards: false, jams: false, works: false };
const FILTER_LABELS = { closures: 'road closures', hazards: 'hazards or accidents', jams: 'traffic jams', works: 'road works' };
const filterEmptyHint = document.getElementById('filterEmptyHint');

// Reflects one active-but-empty filter at a time (checked in a fixed
// order) rather than trying to list several simultaneously — re-run after
// every toggle and every data refresh, since "empty" can change either way
// without the user touching anything.
function updateFilterEmptyHint() {
  const emptyKey = Object.keys(filterVisible).find(
    key => filterVisible[key] && filterLayers[key].getLayers().length === 0
  );
  filterEmptyHint.textContent = emptyKey ? `No ${FILTER_LABELS[emptyKey]} reported right now` : '';
}

document.querySelectorAll('.filter-toggle').forEach((btn) => {
  const key = btn.dataset.filter;
  btn.addEventListener('click', () => {
    haptic();
    filterVisible[key] = !filterVisible[key];
    btn.classList.toggle('active', filterVisible[key]);
    if (filterVisible[key]) {
      restoreGroupFade(filterLayers[key]); // cancels a fade still running from a rapid off/on
      map.addLayer(filterLayers[key]);
    } else {
      fadeGroupOut(map, filterLayers[key]);
    }
    updateFilterEmptyHint();
  });
});

const PALETTE = { fast: '#2ecc71', moderate: '#f1c40f', slow: '#e74c3c' };

// Fractions of a road's own free-flow speed, not absolute km/h. 50 km/h is
// severe congestion on a motorway that normally runs at 110 (0.45) and
// completely normal on a street that tops out at 55 (0.91) — the same
// number, opposite meanings, which is exactly what the absolute thresholds
// below get wrong.
const RELATIVE_FAST = 0.75;
const RELATIVE_MODERATE = 0.5;

// freeFlow is null until the Worker's estimate for that path has enough
// samples to be trustworthy (see MIN_BASELINE_SAMPLES in worker.js), and
// stays null for roads whose sensor never reports. Both fall back to the
// absolute scale, which is what the legend describes in that state.
function colorFor(speed, freeFlow) {
  const p = PALETTE;
  if (speed == null || speed < 0) return '#95a5a6'; // -1 = malfunctioning sensor
  if (freeFlow != null && freeFlow > 0) {
    const ratio = speed / freeFlow;
    if (ratio >= RELATIVE_FAST) return p.fast;
    if (ratio >= RELATIVE_MODERATE) return p.moderate;
    return p.slow;
  }
  if (speed > 60) return p.fast;
  if (speed >= 30) return p.moderate;
  return p.slow;
}

// Roads render on a canvas, not DOM elements, so a plain CSS transition
// can't animate their color the way it can for the panels/buttons above —
// a color change on refresh used to just snap instantly. Manually
// interpolating over a few frames instead makes a speed change read as
// "the data updated" rather than "the map glitched."
function lerpColor(a, b, t) {
  const pa = [1, 3, 5].map(i => parseInt(a.substr(i, 2), 16));
  const pb = [1, 3, 5].map(i => parseInt(b.substr(i, 2), 16));
  const c = pa.map((v, i) => Math.round(v + (pb[i] - v) * t));
  return '#' + c.map(v => v.toString(16).padStart(2, '0')).join('');
}
// Cancellable for the same reason the group fade is: anything that sets a
// road's colour outright — the colourblind toggle, which recolours every road
// instantly — has to be able to win against an animation still in flight.
// Without this, toggling the palette within the 300ms after a refresh landed
// would let the older animation finish last and leave those roads showing the
// pre-toggle colour until the next poll. setColorNow() is the way to make an
// immediate change that also cancels.
function cancelColorAnimation(layer) {
  layer._colorToken = (layer._colorToken || 0) + 1;
  return layer._colorToken;
}

function setColorNow(layer, color) {
  cancelColorAnimation(layer);
  layer.setStyle({ color });
}

function animateColor(layer, fromColor, toColor, duration = 300) {
  if (fromColor === toColor) return;
  const token = cancelColorAnimation(layer);
  const start = performance.now();
  function step(now) {
    if (layer._colorToken !== token) return; // superseded by a newer change
    const t = Math.min(1, (now - start) / duration);
    layer.setStyle({ color: lerpColor(fromColor, toColor, t) });
    if (t < 1) requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}

// Mirrors marker-in (CSS) — a marker's icon is a real DOM element (divIcon),
// so its removal can shrink/fade the same way it grew in, instead of
// vanishing instantly like it used to.
function fadeOutMarker(layerGroup, marker, duration = 200) {
  const el = marker.getElement && marker.getElement();
  const inner = el && el.querySelector('.report-marker');
  if (!inner) { layerGroup.removeLayer(marker); return; }
  inner.style.transition = `transform ${duration}ms ease, opacity ${duration}ms ease`;
  inner.style.transform = 'scale(0.3)';
  inner.style.opacity = '0';
  setTimeout(() => layerGroup.removeLayer(marker), duration);
}

// Lines render on canvas (see the map's `renderer` option), not as DOM
// elements — no CSS transition to hook, so the fade is manually stepped via
// rAF instead, same technique as animateColor but for opacity.
function fadeOutLine(layerGroup, line, duration = 200) {
  const startOpacity = line.options.opacity != null ? line.options.opacity : 1;
  const start = performance.now();
  function step(now) {
    const t = Math.min(1, (now - start) / duration);
    line.setStyle({ opacity: startOpacity * (1 - t) });
    if (t < 1) requestAnimationFrame(step);
    else layerGroup.removeLayer(line);
  }
  requestAnimationFrame(step);
}

// Toggling a filter chip off used to call map.removeLayer(group) directly —
// instant, bypassing fadeOutMarker/fadeOutLine entirely (those only fire
// when an item genuinely drops out of the data between polls, a much rarer
// event than a user tapping a filter chip). Fades every marker/line the
// group actually contains — via eachLayer, which markercluster documents as
// walking every real marker regardless of current clustering state — then
// detaches the group once that's had time to play. Markers currently hidden
// inside a cluster bubble have no individual DOM element to fade and just
// disappear with the group at the end, same as before.
//
// The fade has to be cancellable, because the user can tap the same chip
// back on inside the 200ms window: otherwise the in-flight rAF keeps driving
// line opacity to 0 and the trailing timer detaches a layer the chip now
// says is visible, leaving an "on" chip over an empty map that takes two
// taps to recover. Each fade claims a token, and anything that re-enables
// the group bumps it; every deferred callback re-checks its token first.
function bumpFadeToken(group) {
  group._fadeToken = (group._fadeToken || 0) + 1;
  return group._fadeToken;
}

// Undoes a fade that may still be mid-flight (or already finished) so the
// group is fully visible again when re-added. Marker icons are recreated
// from scratch by Leaflet on re-add, so those only need clearing while the
// element still exists; canvas lines keep the same object throughout and
// have to be restored from the opacity captured before any fade began.
function restoreGroupFade(group) {
  bumpFadeToken(group);
  group.eachLayer(layer => {
    const el = layer.getElement && layer.getElement();
    const inner = el && el.querySelector('.report-marker');
    if (inner) {
      inner.style.transition = '';
      inner.style.transform = '';
      inner.style.opacity = '';
    } else if (layer.setStyle && layer._fadeBaseOpacity != null) {
      layer.setStyle({ opacity: layer._fadeBaseOpacity });
    }
  });
}

function fadeGroupOut(map, group, duration = 200) {
  const token = bumpFadeToken(group);
  const stale = () => group._fadeToken !== token;
  group.eachLayer(layer => {
    const el = layer.getElement && layer.getElement();
    const inner = el && el.querySelector('.report-marker');
    if (inner) {
      inner.style.transition = `transform ${duration}ms ease, opacity ${duration}ms ease`;
      inner.style.transform = 'scale(0.3)';
      inner.style.opacity = '0';
    } else if (layer.setStyle) {
      // Captured once and kept: options.opacity is what the fade itself
      // mutates, so re-reading it on a second fade would latch a
      // partially-faded value as the "original".
      if (layer._fadeBaseOpacity == null) {
        layer._fadeBaseOpacity = layer.options.opacity != null ? layer.options.opacity : 1;
      }
      const base = layer._fadeBaseOpacity;
      const start = performance.now();
      function step(now) {
        if (stale()) return;
        const t = Math.min(1, (now - start) / duration);
        layer.setStyle({ opacity: base * (1 - t) });
        if (t < 1) requestAnimationFrame(step);
      }
      requestAnimationFrame(step);
    }
  });
  setTimeout(() => { if (!stale()) map.removeLayer(group); }, duration);
}

// Applied here, after the filter chips exist, rather than at parse time up
// top — the layers and buttons this has to touch aren't defined yet at that
// point.
if (hashView) {
  if (hashView.filters) {
    for (const key of hashView.filters) {
      filterVisible[key] = true;
      map.addLayer(filterLayers[key]);
      document.querySelector(`.filter-toggle[data-filter="${key}"]`).classList.add('active');
    }
  }
}

const sheet = document.getElementById('sheet');
const backdrop = document.getElementById('backdrop');
const sheetBody = document.getElementById('sheetBody');
const sheetClose = document.getElementById('sheetClose');

function showSheet() {
  sheet.classList.add('open');
  backdrop.classList.add('open');
}
function closeSheet() {
  sheet.classList.remove('open');
  backdrop.classList.remove('open');
}

// Swipe-down-to-dismiss — tap-only felt dated for a bottom sheet. Follows
// the finger while dragging downward, snaps closed past a threshold or
// back to open otherwise; upward drags are ignored (nothing to reveal above
// the sheet's resting position).
let sheetDragStartY = null;
let sheetDragDelta = 0;
sheet.addEventListener('touchstart', (e) => {
  sheetDragStartY = e.touches[0].clientY;
  sheet.style.transition = 'none';
}, { passive: true });
sheet.addEventListener('touchmove', (e) => {
  if (sheetDragStartY == null) return;
  const dy = e.touches[0].clientY - sheetDragStartY;
  if (dy > 0) {
    sheetDragDelta = dy;
    sheet.style.transform = `translateY(${dy}px)`;
  }
}, { passive: true });
sheet.addEventListener('touchend', () => {
  sheet.style.transition = '';
  sheet.style.transform = '';
  if (sheetDragDelta > 80) closeSheet();
  sheetDragStartY = null;
  sheetDragDelta = 0;
});
function formatTravelTime(seconds) {
  if (seconds == null || seconds < 0) return null;
  return seconds < 60 ? `${Math.round(seconds)} sec` : `${Math.round(seconds / 60)} min`;
}

// The number alone doesn't say whether it's good or bad — 50 km/h means
// opposite things on a motorway and a side street. Where a learned free-flow
// speed exists, say so in words rather than making the reader infer it from
// the line's colour.
function describeRelativeSpeed(speed, freeFlow) {
  if (freeFlow == null || freeFlow <= 0) return null;
  const ratio = speed / freeFlow;
  const label = ratio >= RELATIVE_FAST ? 'Flowing normally'
    : ratio >= RELATIVE_MODERATE ? 'Slower than usual'
    : 'Much slower than usual';
  return `${label} · usually ~${Math.round(freeFlow)} km/h here`;
}

function openSheet(speed, travelTimeS, freeFlowKmh) {
  const travel = formatTravelTime(travelTimeS);
  const context = (speed != null && speed >= 0) ? describeRelativeSpeed(speed, freeFlowKmh) : null;
  sheetBody.innerHTML = (speed != null && speed >= 0)
    ? `<div class="sheet-speed">${speed}<span class="unit">km/h</span></div>${context ? `<div class="sheet-context">${escapeHtml(context)}</div>` : ''}${travel ? `<div class="sheet-meta">~${travel} travel time</div>` : ''}`
    : `<div class="sheet-nodata">No live data for this road</div>`;
  showSheet();
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, (c) => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[c]));
}

// Custom icon set replacing emoji markers — emoji render inconsistently
// across OSes (Android/iOS/desktop each ship their own emoji font, so the
// same character can look meaningfully different depending on the device),
// undermining the whole point of a consistent visual language. Sourced from
// open icon sets (mdi, Iconoir, Font Awesome 6, Solar, Material Symbols —
// all MIT/Apache/CC, no attribution required) rather than drawn by hand.
// Each entry is the raw path markup plus its native viewBox; iconSvg() below

// background) rather than baking one fixed appearance into the data.
const ICONS = {

function iconSvg(name, { size = 17, fill = 'white' } = {}) {
  const icon = ICONS[name] || ICONS.fallback;
  const [, , vw, vh] = icon.viewBox.split(' ').map(Number);
  const width = size;
  const height = Math.round(size * vh / vw);
  return `<svg width="${width}" height="${height}" viewBox="${icon.viewBox}" fill="${fill}" style="vertical-align:-3px">${icon.path}</svg>`;
}

// Waze alert type -> marker color/icon. Unrecognized types (Waze adds new
// ones occasionally) fall back to a generic gray marker rather than being
// silently dropped, so a new type is still visible, just unstyled.
function alertStyle(type) {
  return {
    ROAD_CLOSED: { color: '#c0392b', icon: 'barrierBlock', label: 'Road closed' },
    HAZARD: { color: '#f39c12', icon: 'triangle', label: 'Hazard' },
    ACCIDENT: { color: '#d90429', icon: 'carBurst', label: 'Accident' },
    JAM: { color: '#8e44ad', icon: 'jam', label: 'Jam' },
  }[type] || { color: '#7f8c8d', icon: 'fallback', label: type || 'Report' };
}

// Official situation record type -> marker color/icon, grouped by what it
// visually means to a driver rather than the raw DATEX II record type name.
function situationStyle(type) {
  if (type === 'VehicleObstruction') return { color: '#c0392b', icon: 'barricade', label: 'Obstruction' };
  if (type === 'GenericSituationRecord') return { color: '#7f8c8d', icon: 'siren', label: 'Incident' };
  return { color: '#e67e22', icon: 'excavator', label: 'Road works' }; // Maintenance/Construction/LaneManagement
}

// Filter chips carry the same icon as the markers they toggle, in that
// category's own color — they were left on emoji when the markers moved to
// SVG, which put a system-font emoji on the chip next to the very icon it
// controls. Derived from the style functions above rather than a fourth
// hand-kept copy of the icon/color pairs.
const FILTER_STYLES = {
  closures: alertStyle('ROAD_CLOSED'),
  hazards: alertStyle('HAZARD'),
  jams: alertStyle('JAM'),
  works: situationStyle('MaintenanceWorks'),
};
document.querySelectorAll('.filter-toggle').forEach((btn) => {
  const style = FILTER_STYLES[btn.dataset.filter];
  if (style) btn.innerHTML = iconSvg(style.icon, { size: 20, fill: style.color });
});

// A purple/magenta gradient rather than red/orange — jam severity and road
// speed are different measurements, so overlapping both on the same
// red-orange-yellow scale made a red road and a red jam read as "the same
// kind of bad" at a glance even though they mean different things.
function jamColor(level) {
  if (level >= 5) return '#5a189a';
  if (level >= 4) return '#7b2cbf';
  if (level >= 3) return '#9d4edd';
  if (level >= 2) return '#c77dff';
  return '#e0aaff'; // level 1
}

function reportMarker(lat, lon, color, symbol, onClick, targetLayer) {
  const marker = L.marker([lat, lon], {
    icon: L.divIcon({
      className: '', iconSize: [30, 30], iconAnchor: [15, 15],
      html: `<div class="report-marker" style="background:${color}">${symbol}</div>`,
    }),
  }).addTo(targetLayer);
  marker.on('click', (e) => {
    L.DomEvent.stopPropagation(e);
    haptic();
    onClick();
  });
  return marker;
}

function openAlertSheet(a) {
  const s = alertStyle(a.type);
  const sub = a.subtype ? escapeHtml(a.subtype.replace(/_/g, ' ').toLowerCase()) : '';
  sheetBody.innerHTML = `
    <div class="sheet-title">${iconSvg(s.icon, { size: 20, fill: s.color })} ${s.label}${sub ? ' — ' + sub : ''}</div>
    ${a.street ? `<div class="sheet-sub">${escapeHtml(a.street)}</div>` : ''}
    ${a.report_time ? `<div class="sheet-meta">Reported ${escapeHtml(a.report_time)}</div>` : ''}
    <div class="sheet-source">Source: Waze Alerts</div>
  `;
  showSheet();
}

function openJamSheet(j) {
  sheetBody.innerHTML = `
    <div class="sheet-title">${iconSvg('jam', { size: 20, fill: '#8e44ad' })} Crowdsourced jam</div>
    ${j.from || j.to ? `<div class="sheet-sub">${escapeHtml(j.from || '')}${j.from && j.to ? ' → ' : ''}${escapeHtml(j.to || '')}</div>` : ''}
    <div class="sheet-meta">Jam level ${j.jam_level}/5</div>
    <div class="sheet-source">Source: Waze Traffic</div>
  `;
  showSheet();
}

function openSituationSheet(sit) {
  const s = situationStyle(sit.type);
  const period = sit.starts_at
    ? `${escapeHtml(sit.starts_at.replace('T', ' '))}${sit.ends_at ? ' – ' + escapeHtml(sit.ends_at.replace('T', ' ')) : ''}`
    : '';
  sheetBody.innerHTML = `
    <div class="sheet-title">${iconSvg(s.icon, { size: 20, fill: s.color })} ${s.label}</div>
    ${sit.description ? `<div class="sheet-sub">${escapeHtml(sit.description)}</div>` : ''}
    ${period ? `<div class="sheet-meta">${period}</div>` : ''}
    <div class="sheet-source">Source: traffic4cyprus (official)</div>
  `;
  showSheet();
}

function openClosureSheet(rc) {
  sheetBody.innerHTML = `
    <div class="sheet-title">${iconSvg('barrierBlock', { size: 20, fill: '#c0392b' })} Road closed</div>
    ${rc.street ? `<div class="sheet-sub">${escapeHtml(rc.street)}</div>` : ''}
    <div class="sheet-meta">${rc.points.length} points along the closed section${rc.report_time ? ' — reported ' + escapeHtml(rc.report_time) : ''}</div>
    <div class="sheet-source">Source: Waze Alerts</div>
  `;
  showSheet();
}
sheetClose.addEventListener('click', () => { haptic(); closeSheet(); });
// The backdrop no longer blocks touches (map must stay pannable/zoomable
// while the sheet is open), so tapping empty map space is what now closes
// it — each road's own click handler stops propagation so opening a sheet
// doesn't immediately trigger this and close it again.
map.on('click', closeSheet);

const toastEl = document.getElementById('toast');
let toastTimer;
function showToast(msg) {
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastEl.classList.remove('show'), 2500);
}

// Custom-styled zoom buttons instead of Leaflet's default control (hidden
// above via .leaflet-control-zoom) to match the app's own white-pill design
// language rather than mixing in Leaflet's default skin.
const zoomInBtn = document.getElementById('zoomInBtn');
const zoomOutBtn = document.getElementById('zoomOutBtn');
zoomInBtn.addEventListener('click', (e) => { e.stopPropagation(); haptic(); map.zoomIn(); });
zoomOutBtn.addEventListener('click', (e) => { e.stopPropagation(); haptic(); map.zoomOut(); });
function updateZoomButtons() {
  zoomInBtn.classList.toggle('disabled', map.getZoom() >= map.getMaxZoom());
  zoomOutBtn.classList.toggle('disabled', map.getZoom() <= map.getMinZoom());
}
map.on('zoomend', updateZoomButtons);
updateZoomButtons();

// Builds the link that parseHashView reads back. Coordinates are rounded to
// 5 decimals (~1m) — enough to pin a junction, while keeping the link short
// enough to paste into a message without it wrapping over several lines.
function buildShareUrl() {
  const c = map.getCenter();
  // Assembled by hand rather than via URLSearchParams.toString(), which
  // percent-encodes the separators into `%2F` and `%2C` — still correct, and
  // URLSearchParams decodes them again on the way back in, but it turns a
  // glanceable link into a wall of escapes in the one place users actually
  // see the URL. Both characters are legal unescaped in a fragment.
  const parts = [`map=${map.getZoom()}/${c.lat.toFixed(5)}/${c.lng.toFixed(5)}`];
  const on = SHAREABLE_FILTERS.filter(key => filterVisible[key]);
  if (on.length) parts.push(`filters=${on.join(',')}`);
  // Theme is deliberately not shared: it's a property of how the person
  // reading likes their screen, not of the traffic situation being pointed
  // at. Filters describe *what* the link is showing; theme doesn't, and
  // forcing it would override the recipient's own preference.
  return `${location.origin}${location.pathname}#${parts.join('&')}`;
}

// navigator.clipboard is a permissioned API and genuinely gets denied —
// NotAllowedError in an embedded/iframed context, older Firefox, or a
// hardened profile. The deprecated execCommand path still works in exactly
// those cases, so it's the difference between the share button doing
// nothing and doing its job. Off-screen rather than display:none, because
// a hidden textarea can't be selected.
function legacyCopy(text) {
  const el = document.createElement('textarea');
  el.value = text;
  el.setAttribute('readonly', '');
  el.style.cssText = 'position:absolute;left:-9999px;top:0';
  document.body.appendChild(el);
  el.select();
  try {
    return document.execCommand('copy');
  } catch (e) {
    return false;
  } finally {
    document.body.removeChild(el);
  }
}

const shareBtn = document.getElementById('shareBtn');
shareBtn.addEventListener('click', async (e) => {
  e.stopPropagation();
  haptic();
  const url = buildShareUrl();
  // Update the address bar too, so the link is also grabbable the ordinary
  // way. replaceState rather than assigning location.hash — the latter adds
  // a history entry, turning the phone's back button into an undo of every
  // share tap instead of a way out of the app.
  history.replaceState(null, '', url);
  try {
    // The native sheet on mobile (where this app is aimed) puts the link
    // straight into whatever messaging app the person actually uses;
    // clipboard is the desktop fallback.
    if (navigator.share) {
      await navigator.share({ title: 'Cyprus Live Traffic', url });
    } else {
      await navigator.clipboard.writeText(url);
      showToast('Link copied');
    }
  } catch (err) {
    // AbortError just means the share sheet was dismissed — a deliberate
    // "never mind", not a failure worth reporting back to the user.
    if (err && err.name === 'AbortError') return;
    showToast(legacyCopy(url) ? 'Link copied' : 'Could not copy link');
  }
});

let userMarker = null;
const locateBtn = document.getElementById('locateBtn');

// Falls back to fitting all paths only if geolocation was tried and failed
// (denied, timed out, unsupported) — a successful locate wins and we leave
// the user zoomed into their own area instead of zooming back out.
let locationOutcome = null; // null = pending, 'found' | 'error'
let pathBounds = null;

function doLocate() {
  locateBtn.classList.add('locating');
  map.locate({ setView: true, maxZoom: 15, enableHighAccuracy: true, timeout: 10000 });
}
locateBtn.addEventListener('click', () => { haptic(); doLocate(); });

map.on('locationfound', (e) => {
  locateBtn.classList.remove('locating', 'denied');
  locationOutcome = 'found';
  if (userMarker) map.removeLayer(userMarker);
  userMarker = L.circleMarker(e.latlng, {
    radius: 8, color: '#fff', weight: 3, fillColor: '#4285F4', fillOpacity: 1
  }).addTo(map);
});

map.on('locationerror', (e) => {
  locateBtn.classList.remove('locating');
  locationOutcome = 'error';
  // Permission denial specifically gets a persistent marker on the button
  // itself (see .locate-btn.denied) rather than relying only on this toast,
  // which is gone in a couple seconds — so it's still visible if you check
  // back later, not just at the moment it happened.
  if (e.code === 1) locateBtn.classList.add('denied');
  showToast(
    e.code === 1 ? 'Location permission denied' : 'Could not get your location'
  );
  // Only zoom out to fit every road if there was nowhere better to fall
  // back to — a shared link or saved view (see above) already put the map
  // somewhere more useful than the whole island before geolocation was even
  // attempted. Checking initialView rather than savedView matters for the
  // shared-link case: fitting the whole island here would throw away the
  // exact spot the link was pointing at.
  if (!initialView && pathBounds) map.fitBounds(pathBounds, { padding: [20, 20] });
});

// Try to center on the user as soon as the app opens, no tap required —
// except on local file:// testing, where the page auto-reloads every few
// minutes and re-centering/re-prompting for location each time would be
// disruptive, and except when following a shared link, where snapping to
// the visitor's own position would defeat the entire point of the link.
// The button is still there to trigger it manually in both cases.
if (location.protocol !== 'file:' && !(hashView && hashView.lat != null)) {
  doLocate();
}

const DATA_URL = 'https://cyprus-live-traffic.tsiakkaris-andreas.workers.dev/latest.json';
const REFRESH_INTERVAL_MS = 3 * 60 * 1000; // keep pace with the Worker's 5-min cron without over-fetching

// Waits for both the first data fetch AND the basemap's initial tiles to be
// in place before revealing the map — hiding the spinner on data alone used
// to sometimes uncover still-loading/blank tiles underneath (a "hard cut"
// to an unfinished map), instead of one clean reveal once there's actually
// something worth looking at. A timeout is the safety net in case a tile
// request never resolves (aborted by a pan, dropped connection, etc.) —
// better to reveal a slightly-incomplete map than get stuck spinning.
const loadingOverlay = document.getElementById('loadingOverlay');
let firstLoadSettled = false;
let dataReady = false;
let tilesReady = false;
function maybeRevealMap() {
  if (firstLoadSettled || !dataReady || !tilesReady) return;
  firstLoadSettled = true;
  loadingOverlay.classList.add('hidden');
}
function hideLoadingOverlay() {
  dataReady = true;
  maybeRevealMap();
}
setTimeout(() => { tilesReady = true; maybeRevealMap(); }, 4000);

const layersById = new Map();
const alertsById = new Map();
const roadClosuresById = new Map();
const jamsById = new Map();
const situationsById = new Map();
let initialLoadDone = false;

// Flags data as stale at 2x the refresh interval — by then a normal refresh
// should have landed, so still showing the old timestamp means something's
// actually wrong upstream (as opposed to just "a couple minutes old").
const freshnessEl = document.getElementById('freshness');
const freshnessTextEl = document.getElementById('freshnessText');
const outdatedNoteEl = document.getElementById('outdatedNote');
let lastGeneratedAt = null;
function updateFreshnessLabel() {
  if (!lastGeneratedAt) return;
  const mins = Math.floor((Date.now() - lastGeneratedAt.getTime()) / 60000);
  const isStale = mins * 60000 > REFRESH_INTERVAL_MS * 2;
  // Once stale, "Updated N min ago" reads like the app itself failed to sync
  // with the Worker. It didn't — the app polled fine, the Worker just has
  // nothing newer to serve (storeIfHealthy rejected everything since, see
  // worker.js). Naming the feed, not the app, as the stuck party here.
  const text = mins < 1 ? 'Updated just now'
    : isStale ? `Feed stuck — last data (${mins}) min ago`
    : `Updated ${mins} min ago`;
  freshnessTextEl.textContent = text;
  freshnessEl.classList.toggle('stale', isStale);
}
setInterval(updateFreshnessLabel, 30000);

// Separate from updateFreshnessLabel above: that one only proves the app's
// own poll succeeded, this one checks whether the underlying feed data is
// actually current. commonMeasurementTimestamp only advances if the feed
// genuinely produces new measurements — a frozen upstream feed can keep
// returning 200 OK with the same stale timestamp indefinitely.
// 1h threshold matches the same convention used server-side in the
// traffic-control-room project's own staleness checks.
const OUTDATED_THRESHOLD_MS = 60 * 60 * 1000;
let commonMeasurementTimestamp = null;
function updateOutdatedNote() {
  if (!commonMeasurementTimestamp) { outdatedNoteEl.hidden = true; return; }
  const since = new Date(commonMeasurementTimestamp);
  const ageMs = Date.now() - since.getTime();
  if (ageMs <= OUTDATED_THRESHOLD_MS) { outdatedNoteEl.hidden = true; return; }
  const totalHours = Math.floor(ageMs / 3600000);
  const days = Math.floor(totalHours / 24);
  const hours = totalHours % 24;
  const duration = days >= 1 ? (days < 3 ? `${days}d ${hours}h` : `${days}d`) : `${totalHours}h`;
  outdatedNoteEl.textContent = `No upstream traffic feed since ${since.toLocaleString()} (${duration})`;
  outdatedNoteEl.hidden = false;
}
setInterval(updateOutdatedNote, 30000);

function loadData() {
  return fetch(DATA_URL)
    .then(r => r.json())
    .then(data => {
      lastGeneratedAt = new Date(data.generated_at);
      updateFreshnessLabel();
      commonMeasurementTimestamp = data.common_measurement_timestamp || null;
      updateOutdatedNote();
      hideLoadingOverlay();
      const bounds = [];
      const seenIds = new Set();
      data.paths.forEach(p => {
        if (!p.coords || p.coords.length < 2) return;
        seenIds.add(p.id);
        const latlngs = p.coords.map(c => [c[0], c[1]]);
        let entry = layersById.get(p.id);
        const newColor = colorFor(p.speed_kmh, p.free_flow_kmh);
        if (entry) {
          // Update in place — re-drawing 431 fresh polylines every refresh
          // would flicker and drop whatever the user was mid-interaction
          // with (e.g. an open bottom sheet).
          animateColor(entry.visible, entry.color, newColor);
          entry.color = newColor;
          entry.hit.speedKmh = p.speed_kmh;
          entry.hit.travelTimeS = p.travel_time_s;
          entry.hit.freeFlowKmh = p.free_flow_kmh;
        } else {
          // Two lines per road: a thin visible one (what you see) and a much
          // wider invisible one on top of it (what actually catches taps) —
          // the visible line alone is too thin a target to tap reliably,
          // especially zoomed out.
          const visible = L.polyline(latlngs, {
            color: newColor, weight: 5, opacity: 0.85,
            interactive: false
          }).addTo(map);
          const hit = L.polyline(latlngs, {
            weight: 22, opacity: 0, interactive: true
          }).addTo(map);
          hit.speedKmh = p.speed_kmh;
          hit.travelTimeS = p.travel_time_s;
          hit.freeFlowKmh = p.free_flow_kmh;
          hit.on('click', (e) => {
            L.DomEvent.stopPropagation(e); // don't let this bubble to the map's own click-to-close handler
            haptic();
            openSheet(hit.speedKmh, hit.travelTimeS, hit.freeFlowKmh);
          });
          entry = { visible, hit, color: newColor };
          layersById.set(p.id, entry);
        }
        latlngs.forEach(ll => bounds.push(ll));
      });

      // Remove any road that no longer appears in the feed at all (retired
      // upstream) — otherwise it lingers on the map forever, frozen at
      // whatever color/data it last had, since the loop above only ever
      // adds or updates, never deletes.
      for (const [id, entry] of layersById) {
        if (!seenIds.has(id)) {
          fadeOutLine(map, entry.visible);
          map.removeLayer(entry.hit); // invisible hit target, nothing to visibly fade
          layersById.delete(id);
        }
      }

      // Waze crowdsourced point reports, routed by Waze's own alert type:
      // ROAD_CLOSED joins the "closures" filter, HAZARD/ACCIDENT (and any
      // unrecognized type) join "hazards", and JAM-type reports join the
      // jams filter alongside the jam line segments below — stored with
      // their target layer since which filter an entry belongs to varies
      // per-alert here.
      const ALERT_FILTER = { ROAD_CLOSED: 'closures', JAM: 'jams' };
      const seenAlertIds = new Set();
      (data.alerts || []).forEach(a => {
        if (a.lat == null || a.lon == null) return;
        seenAlertIds.add(a.id);
        if (alertsById.has(a.id)) return; // reports are immutable snapshots, nothing to update in place
        const s = alertStyle(a.type);
        const layer = filterLayers[ALERT_FILTER[a.type] || 'hazards'];
        const marker = reportMarker(a.lat, a.lon, s.color, iconSvg(s.icon, { size: 17 }), () => openAlertSheet(a), layer);
        alertsById.set(a.id, { marker, layer });
      });
      for (const [id, entry] of alertsById) {
        if (!seenAlertIds.has(id)) {
          fadeOutMarker(entry.layer, entry.marker);
          alertsById.delete(id);
        }
      }

      // Multi-point road closures (see worker.js groupRoadClosures) — Waze's
      // own map draws these as barrier icons connected by a line rather than
      // isolated dots, since a closure often spans several waypoints along
      // one road. The line already conveys the full shape, so only the start
      // and end get their own marker — a marker per intermediate waypoint
      // (some closures have 5-6) was just clutter on a small phone screen.
      const closureStyle = alertStyle('ROAD_CLOSED');
      const seenClosureIds = new Set();
      (data.road_closures || []).forEach(rc => {
        if (!rc.points || rc.points.length < 2) return;
        seenClosureIds.add(rc.id);
        if (roadClosuresById.has(rc.id)) return; // immutable snapshot, same rationale as alerts above
        const latlngs = rc.points.map(p => [p.lat, p.lon]);
        const line = L.polyline(latlngs, {
          color: closureStyle.color, weight: 5, opacity: 0.85, dashArray: '2,8'
        }).addTo(filterLayers.closures);
        line.on('click', (e) => { L.DomEvent.stopPropagation(e); haptic(); openClosureSheet(rc); });
        const endpoints = [rc.points[0], rc.points[rc.points.length - 1]];
        const markers = endpoints.map(p =>
          reportMarker(p.lat, p.lon, closureStyle.color, iconSvg(closureStyle.icon, { size: 17 }), () => openClosureSheet(rc), filterLayers.closures)
        );
        roadClosuresById.set(rc.id, { line, markers });
      });
      for (const [id, entry] of roadClosuresById) {
        if (!seenClosureIds.has(id)) {
          fadeOutLine(filterLayers.closures, entry.line);
          entry.markers.forEach(m => fadeOutMarker(filterLayers.closures, m));
          roadClosuresById.delete(id);
        }
      }

      // Waze crowdsourced jam segments — only levels 1+ are drawn; a
      // segment that drops back to level 0 is treated as "gone" so it
      // gets cleaned up by the pass below, same as a road that vanishes.
      const seenJamIds = new Set();
      (data.jams || []).forEach(j => {
        if (!j.coords || j.coords.length < 2 || !j.jam_level) return;
        seenJamIds.add(j.id);
        const latlngs = j.coords.map(c => [c[0], c[1]]);
        let line = jamsById.get(j.id);
        if (line) {
          line.setStyle({ color: jamColor(j.jam_level) });
          line.jamData = j;
        } else {
          line = L.polyline(latlngs, { color: jamColor(j.jam_level), weight: 6, opacity: 0.8 }).addTo(filterLayers.jams);
          line.jamData = j;
          line.on('click', (e) => {
            L.DomEvent.stopPropagation(e);
            haptic();
            openJamSheet(line.jamData);
          });
          jamsById.set(j.id, line);
        }
      });
      for (const [id, line] of jamsById) {
        if (!seenJamIds.has(id)) {
          fadeOutLine(filterLayers.jams, line);
          jamsById.delete(id);
        }
      }

      // Official road-works/incident situations (SituationPublication).
      const seenSituationIds = new Set();
      (data.situations || []).forEach(sit => {
        if (sit.lat == null || sit.lon == null) return;
        seenSituationIds.add(sit.id);
        if (situationsById.has(sit.id)) return; // same rationale as alerts above
        const s = situationStyle(sit.type);
        const marker = reportMarker(sit.lat, sit.lon, s.color, iconSvg(s.icon, { size: 17 }), () => openSituationSheet(sit), filterLayers.works);
        situationsById.set(sit.id, marker);
      });
      for (const [id, marker] of situationsById) {
        if (!seenSituationIds.has(id)) {
          fadeOutMarker(filterLayers.works, marker);
          situationsById.delete(id);
        }
      }

      if (bounds.length && !initialLoadDone) {
        initialLoadDone = true;
        pathBounds = bounds;
        if (locationOutcome === 'error') map.fitBounds(pathBounds, { padding: [20, 20] });
      }
      updateFilterEmptyHint();
    })
    .catch(err => {
      console.error('Failed to load latest.json:', err);
      showToast(initialLoadDone ? "Couldn't refresh — showing last known data" : "Couldn't load traffic data");
      hideLoadingOverlay();
    });
}

loadData();

if (location.protocol === 'file:') {
  // Local file:// testing only: a full page reload already re-runs loadData()
  // from scratch as the very first thing the script does on load, so this
  // alone covers both "fetch fresh data" and "pick up code changes" —
  // deterministically, since it's one action, not two independent timers
  // racing each other. Never do this for the deployed app — it would reset
  // a real user's map position and interrupt whatever they're looking at.
  setInterval(() => location.reload(), REFRESH_INTERVAL_MS);
} else {
  setInterval(loadData, REFRESH_INTERVAL_MS);
}

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(err => console.error('SW registration failed:', err));
  });
}
</script>
</body>
</html>
