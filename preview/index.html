<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Cyprus Live Traffic — Preview</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1a1a2e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body, #map { height: 100%; margin: 0; overflow: hidden; overscroll-behavior: none; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }

  .legend {
    position: absolute; z-index: 1000;
    top: calc(env(safe-area-inset-top, 0px) + 12px);
    right: calc(env(safe-area-inset-right, 0px) + 12px);
    background: rgba(255,255,255,0.95); padding: 10px 14px; border-radius: 12px;
    font-size: 13px; line-height: 1.9;
    box-shadow: 0 2px 10px rgba(0,0,0,.18);
  }
  .legend div { display: flex; align-items: center; }
  .legend span { display: inline-block; width: 10px; height: 10px; margin-right: 8px; border-radius: 50%; }

  .leaflet-control-zoom { display: none; } /* pinch-to-zoom only, no mouse-style +/- buttons */

  /* Bottom sheet */
  .sheet {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 2000;
    background: white; border-radius: 20px 20px 0 0;
    box-shadow: 0 -4px 20px rgba(0,0,0,.2);
    padding: 10px 20px calc(env(safe-area-inset-bottom, 0px) + 24px);
    transform: translateY(110%);
    transition: transform 220ms ease;
  }
  .sheet.open { transform: translateY(0); }
  .sheet-handle {
    width: 36px; height: 4px; background: #ddd; border-radius: 2px;
    margin: 0 auto 14px;
  }
  .sheet-close {
    position: absolute; top: 10px; right: 14px;
    width: 30px; height: 30px; border: none; background: none;
    display: flex; align-items: center; justify-content: center;
    color: #999; font-size: 20px; line-height: 1;
  }
  .sheet-speed { font-size: 32px; font-weight: 700; }
  .sheet-speed .unit { font-size: 16px; font-weight: 500; color: #888; margin-left: 4px; }
  .sheet-nodata { font-size: 17px; color: #888; padding: 8px 0; }

  /* Purely visual dimming — never intercepts touches, so the map stays
     pannable/zoomable while the sheet is open. */
  .backdrop {
    position: fixed; inset: 0; z-index: 1500;
    background: rgba(0,0,0,0.15);
    opacity: 0; pointer-events: none;
    transition: opacity 220ms ease;
  }
  .backdrop.open { opacity: 1; }

  .locate-btn {
    position: absolute; z-index: 1000;
    right: calc(env(safe-area-inset-right, 0px) + 12px);
    bottom: calc(env(safe-area-inset-bottom, 0px) + 28px);
    width: 46px; height: 46px; border-radius: 50%;
    background: white; border: none;
    box-shadow: 0 2px 10px rgba(0,0,0,.25);
    display: flex; align-items: center; justify-content: center;
  }
  .locate-btn:active { background: #eee; }
  .locate-btn svg { width: 24px; height: 24px; }
  .locate-btn.locating svg { animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .toast {
    position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 90px);
    transform: translateX(-50%) translateY(10px);
    background: rgba(20,20,20,0.92); color: white;
    padding: 10px 16px; border-radius: 10px; font-size: 14px;
    z-index: 3000; opacity: 0; pointer-events: none;
    transition: opacity 200ms ease, transform 200ms ease;
    white-space: nowrap;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>
<div id="map"></div>

<div class="legend">
  <div><span style="background:#2ecc71"></span>Fast &gt;60</div>
  <div><span style="background:#f1c40f"></span>Moderate 30–60</div>
  <div><span style="background:#e74c3c"></span>Slow &lt;30</div>
  <div><span style="background:#95a5a6"></span>No data or malfunctioning sensors</div>
</div>

<div class="backdrop" id="backdrop"></div>
<div class="sheet" id="sheet">
  <button class="sheet-close" id="sheetClose" aria-label="Close">&times;</button>
  <div class="sheet-handle"></div>
  <div id="sheetBody"></div>
</div>

<button class="locate-btn" id="locateBtn" aria-label="Find my location">
  <svg viewBox="0 0 24 24" fill="none" stroke="#1a1a2e" stroke-width="2">
    <circle cx="12" cy="12" r="3"></circle>
    <path d="M12 2v3M12 19v3M2 12h3M19 12h3"></path>
  </svg>
</button>
<div class="toast" id="toast"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const map = L.map('map', { zoomControl: false, tap: true }).setView([35.05, 33.15], 9);
L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
  attribution: '&copy; OpenStreetMap contributors &copy; <a href="https://carto.com/attributions">CARTO</a>',
  subdomains: 'abcd',
  maxZoom: 20
}).addTo(map);

function colorFor(speed) {
  if (speed == null || speed < 0) return '#95a5a6'; // -1 = malfunctioning sensor
  if (speed > 60) return '#2ecc71';
  if (speed >= 30) return '#f1c40f';
  return '#e74c3c';
}

const sheet = document.getElementById('sheet');
const backdrop = document.getElementById('backdrop');
const sheetBody = document.getElementById('sheetBody');
const sheetClose = document.getElementById('sheetClose');

function openSheet(speed) {
  sheetBody.innerHTML = (speed != null && speed >= 0)
    ? `<div class="sheet-speed">${speed}<span class="unit">km/h</span></div>`
    : `<div class="sheet-nodata">No live data for this road</div>`;
  sheet.classList.add('open');
  backdrop.classList.add('open');
}
function closeSheet() {
  sheet.classList.remove('open');
  backdrop.classList.remove('open');
}
sheetClose.addEventListener('click', closeSheet);
// The backdrop no longer blocks touches (map must stay pannable/zoomable
// while the sheet is open), so tapping empty map space is what now closes
// it — each road's own click handler stops propagation so opening a sheet
// doesn't immediately trigger this and close it again.
map.on('click', closeSheet);

const toastEl = document.getElementById('toast');
let toastTimer;
function showToast(msg) {
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastEl.classList.remove('show'), 2500);
}

let userMarker = null;
const locateBtn = document.getElementById('locateBtn');

// Falls back to fitting all paths only if geolocation was tried and failed
// (denied, timed out, unsupported) — a successful locate wins and we leave
// the user zoomed into their own area instead of zooming back out.
let locationOutcome = null; // null = pending, 'found' | 'error'
let pathBounds = null;

function doLocate() {
  locateBtn.classList.add('locating');
  map.locate({ setView: true, maxZoom: 15, enableHighAccuracy: true, timeout: 10000 });
}
locateBtn.addEventListener('click', doLocate);

map.on('locationfound', (e) => {
  locateBtn.classList.remove('locating');
  locationOutcome = 'found';
  if (userMarker) map.removeLayer(userMarker);
  userMarker = L.circleMarker(e.latlng, {
    radius: 8, color: '#fff', weight: 3, fillColor: '#4285F4', fillOpacity: 1
  }).addTo(map);
});

map.on('locationerror', (e) => {
  locateBtn.classList.remove('locating');
  locationOutcome = 'error';
  showToast(
    e.code === 1 ? 'Location permission denied' : 'Could not get your location'
  );
  if (pathBounds) map.fitBounds(pathBounds, { padding: [20, 20] });
});

// Try to center on the user as soon as the app opens, no tap required.
doLocate();

const DATA_URL = 'https://cyprus-live-traffic.tsiakkaris-andreas.workers.dev/latest.json';
const REFRESH_INTERVAL_MS = 3 * 60 * 1000; // keep pace with the Worker's 5-min cron without over-fetching

const layersById = new Map();
let initialLoadDone = false;

function loadData() {
  return fetch(DATA_URL)
    .then(r => r.json())
    .then(data => {
      const bounds = [];
      data.paths.forEach(p => {
        if (!p.coords || p.coords.length < 2) return;
        const latlngs = p.coords.map(c => [c[0], c[1]]);
        let entry = layersById.get(p.id);
        if (entry) {
          // Update in place — re-drawing 431 fresh polylines every refresh
          // would flicker and drop whatever the user was mid-interaction
          // with (e.g. an open bottom sheet).
          entry.visible.setStyle({ color: colorFor(p.speed_kmh) });
          entry.hit.speedKmh = p.speed_kmh;
        } else {
          // Two lines per road: a thin visible one (what you see) and a much
          // wider invisible one on top of it (what actually catches taps) —
          // the visible line alone is too thin a target to tap reliably,
          // especially zoomed out.
          const visible = L.polyline(latlngs, {
            color: colorFor(p.speed_kmh), weight: 5, opacity: 0.85,
            interactive: false
          }).addTo(map);
          const hit = L.polyline(latlngs, {
            weight: 22, opacity: 0, interactive: true
          }).addTo(map);
          hit.speedKmh = p.speed_kmh;
          hit.on('click', (e) => {
            L.DomEvent.stopPropagation(e); // don't let this bubble to the map's own click-to-close handler
            openSheet(hit.speedKmh);
          });
          entry = { visible, hit };
          layersById.set(p.id, entry);
        }
        latlngs.forEach(ll => bounds.push(ll));
      });
      if (bounds.length && !initialLoadDone) {
        initialLoadDone = true;
        pathBounds = bounds;
        if (locationOutcome === 'error') map.fitBounds(pathBounds, { padding: [20, 20] });
      }
    })
    .catch(err => {
      console.error('Failed to load latest.json:', err);
    });
}

loadData();
setInterval(loadData, REFRESH_INTERVAL_MS);

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(err => console.error('SW registration failed:', err));
  });
}
</script>
</body>
</html>
